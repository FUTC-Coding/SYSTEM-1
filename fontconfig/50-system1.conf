<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- System 1: Departure Mono has no Japanese; fall back to the pixel DotGothic16
     instead of a smooth CJK font, so kanji in the bar stay 1-bit. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Departure Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>DotGothic16</string></edit>
  </match>
</fontconfig>
